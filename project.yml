name: GarageCare
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 10
    MARKETING_VERSION: 1.4.3
    DEVELOPMENT_TEAM: ""
targets:
  GarageCare:
    type: application
    platform: iOS
    sources:
      - path: GarageCare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.garagecare.app
        PRODUCT_NAME: GarageCare
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: "Мой гараж"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - GarageCareTests
        - GarageCareUITests

  GarageCareTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GarageCareTests
    dependencies:
      - target: GarageCare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.garagecare.app.tests
        GENERATE_INFOPLIST_FILE: YES

  GarageCareUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GarageCareUITests
    dependencies:
      - target: GarageCare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.garagecare.app.uitests
        GENERATE_INFOPLIST_FILE: YES

