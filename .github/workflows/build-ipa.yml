name: Собрать IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer main build replaces an older one; do not accumulate competing IPAs.
concurrency:
  group: garagecare-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Проверить Xcode 27
        shell: bash
        run: |
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $SDK_VERSION"
          XCODE_MAJOR="$(xcodebuild -version | awk '/Xcode/{print $2}' | cut -d. -f1)"
          if [[ "$XCODE_MAJOR" != "27" ]]; then
            echo "Ожидался Xcode 27, получен Xcode $XCODE_MAJOR"
            exit 1
          fi

      - name: Установить XcodeGen
        run: brew install xcodegen

      - name: Создать Xcode-проект
        run: xcodegen generate

      - name: Запустить unit- и UI-тесты
        shell: bash
        run: |
          set -o pipefail

          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime_devices in data.get("devices", {}).values():
              for device in runtime_devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("Доступный iPhone Simulator не найден")
          ')"

          echo "Simulator: $SIMULATOR_UDID"
          xcrun simctl boot "$SIMULATOR_UDID" 2>/dev/null || true

          xcodebuild test \
            -project GarageCare.xcodeproj \
            -scheme GarageCare \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -destination-timeout 120 \
            -resultBundlePath "$RUNNER_TEMP/GarageCareTests.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 30 \
            -maximum-test-execution-time-allowance 60 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Собрать unsigned app для iPhone
        shell: bash
        run: |
          set -o pipefail
          xcodebuild clean build \
            -project GarageCare.xcodeproj \
            -scheme GarageCare \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/GarageCareDerived" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Упаковать unsigned IPA
        shell: bash
        run: |
          APP="$RUNNER_TEMP/GarageCareDerived/Build/Products/Release-iphoneos/GarageCare.app"
          test -d "$APP" || { echo "GarageCare.app не найден"; exit 1; }

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")
          IPA_NAME="GarageCare-${VERSION}-build${BUILD}-unsigned.ipa"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$GITHUB_SHA" > "$RUNNER_TEMP/BUILD-INFO.txt"
          echo "VERSION=$VERSION ($BUILD)" >> "$RUNNER_TEMP/BUILD-INFO.txt"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/zip -qry "$RUNNER_TEMP/$IPA_NAME" Payload)
          /usr/bin/unzip -t "$RUNNER_TEMP/$IPA_NAME" >/dev/null

      - name: Загрузить IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: |
            ${{ runner.temp }}/${{ env.IPA_NAME }}
            ${{ runner.temp }}/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 7

      - name: Извлечь снимки экранов UI-тестов
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/GarageCareTests.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/GarageCareTests.xcresult" --output-path "$RUNNER_TEMP/screenshots"
          fi

      - name: Сохранить результаты тестов и снимки экранов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GarageCare-test-results-${{ github.sha }}
          path: |
            ${{ runner.temp }}/GarageCareTests.xcresult
            ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
          retention-days: 14
